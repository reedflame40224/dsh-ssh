# ============================================================================
# dsh-ssh —— DSH bundle patch
# ============================================================================
# 挂载声明。Loader 行 name 必须与 lib/client.js 里 __ModuleLoader__.load
# 烙入的注册 id 完全一致（都是 dsh-ssh）。
#
